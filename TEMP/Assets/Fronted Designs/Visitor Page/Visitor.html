<!doctype html>
<html>

<head>
  <!--Organisation Name-->
  <title>Wall of Respect Digitization</title>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="google" value="notranslate">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <!-- Font awesome -->
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">

  <!-- Slick Slider  CSS-->
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/jquery.slick/1.5.0/slick.css'>
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/jquery.slick/1.5.0/slick-theme.css'>


  <!-- My  CSS -->
  <link rel="stylesheet" href="Css/Main.css">

  <!-- Favicon -->
  <link rel="shortcut icon" href="Img/favicon.png" />

</head>

<body>
  <!-- Preloader -->

  <div class="preloader" id="preloader">
    <div class="preloader_overall">
      <div class="preloader_logo"></div>
      <div class="preloader_circle"></div>
    </div>
  </div>


  <!-- Page Main Content -->

  <!-- Nav Bar -->
  <nav class="navbar navbar-expand-md bg-transparent">
    <div class="navbar-collapse collapse w-100 order-1 order-md-0 dual-collapse2">
      <div class="navbar-nav mr-auto">
        <a class="nav-item back_to_home" href="https://www.touchstonebpo.com/"><i class="fa fa-home fa-lg"></i></a>
      </div>
    </div>
    <div class="mx-auto ">
      <img class="logo" src="Img/white-logo.png" height="300" width="500">
    </div>
    <div class="navbar-collapse collapse w-100 order-3 dual-collapse2">
      <div class="navbar-nav ml-auto ">
        <li class="nav-item">
          <a class="nav-link" href="https://www.linkedin.com/company/touchstonecommunications/" target="_blank">
            <i class="fab fa-linkedin fa-lg"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://www.instagram.com/touchstone_inc/" target="_blank">
            <i class="fab fa-instagram fa-lg"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://www.facebook.com/TouchstoneCommunications" target="_blank">
            <i class="fab fa-facebook fa-lg"></i>
          </a>
        </li>
      </div>
    </div>
  </nav>
  <!-- End of Navbar -->

  <!-- Bootstrap Cards -->
  <div class="container-fluid">
    <!--- Card 1 : Description of Associate -->
    <div class="row">
      <div class="col-sm-3">
        <div class="card-body text-center card_1">
          <h5 class="card-title title_1"> DESCRIPITON </h5>
          <div class="scroll_1">
            <p class="card-text " id="Associate_Description"></p>
            <p class="signature" id="Associate_Signature"></p>
          </div>
        </div>
      </div>
      <!-- Card 2 : Smoke & Center Card for Associate Image -->
      <div class="col-sm-6">
          <div class="card_2">
            <div class="card-body text-center">
              <img class="featured" id="featured">
              <img class="smoke" src="Img/smoke.png">
            </div>
          </div>
      </div>
      <div class="col-sm-3 ">
        <!-- Card 3 : motivational quote -->
        <div class="card-body text-center card_3">
          <h5 class="card-title title_1"> QUOTE </h5>
          <p class="card-text" id="Associate_Quote"></p>
        </div>
        <!-- Card 4 :  Name | Associate campaign /department -->
        <div class="card-body text-center card_4">
          <h5 class="card-title title_2" id="Associate_Name"></h5>
          <p class="card-text title_3" id="Associate_Campaign"></p>
        </div>
      </div>
    </div>
  </div>
  <!-- End of Bootstrap cards-->

  <!-- Slick Slider : Slider -->
  <div class="container  ">
    <!--<h1>Slider</h1>-->
    <ul class="center">
      {% for assc in Associates_List_1 %}
      <div class="thumbnail">
          <!-- Associate Image Path-->
          <img class="get_img_value" id="{{ assc.0 }}" src="{{ assc.5 }}">
          <!-- Associate Image Caption -->
          <figcaption class="overlay">{{ assc.1 }}</figcaption>
          <!-- Assoicate Name -->
          <p hidden class="{{ assc.0 }} Name">{{ assc.1 }}</p>
          <!-- Associate Description -->
          <!-- 382 -->
          <p hidden class="{{ assc.0 }} Descripton">{{ assc.3 }}</p>
          <!-- Associate Quote -->
          <p hidden class="{{ assc.0 }} Quote"> {{ assc.4 }} </p>
          <!-- Associate Campaign -->
          <p hidden class="{{ assc.0 }} Campaign">{{ assc.6 }}</p>
      </div>
      {% endfor %}
    </ul>
  </div>
  <!-- End Of Slick Slider -->


  <!-- Slick Slider : Buttons -->
  <div class="content-wrapper">
    <div class="bottom">
      <!-- Left Button -->
      <button class="prev-image">
        <i class="fa fa-caret-square-o-left" aria-hidden="true"></i> &nbsp;
      </button>
      <b> Wall of Respect </b>
      &nbsp;
      <!-- Right Button -->
      <button class="next-image">
        <i class="fa fa-caret-square-o-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <!-- End of Slick Slider buttons-->


  <!-- BootStrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk="
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>

  <!-- Preloader -->
  <script src="Js/Preloader.js"></script>

  <!-- Slick Slider -->
  <script src='https://cdn.jsdelivr.net/jquery.slick/1.5.0/slick.min.js'></script>
  <script src="Js/Slick_Slider.js"></script>


  

</body>

</html>
